AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CI/CD workshop - event-driven order processing

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]      # the lab host is ARM, so sam local runs the ARM image natively
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ORDERS_TABLE: !Ref OrdersTable
        EVENT_BUS_NAME: !Ref EventBus

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cicd-workshop-orders
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH

  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: cicd-workshop-bus

  OrderApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cicd-workshop-order-api-errors
      AlarmDescription: Errors on the order API live alias during deployment
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref OrderApiFunction
        - Name: Resource
          Value: !Sub '${OrderApiFunction}:live'
        - Name: ExecutedVersion
          Value: !GetAtt OrderApiFunction.Version.Version
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  OrderApiDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cicd-workshop-order-api-duration
      AlarmDescription: p99 latency on the order API live alias
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref OrderApiFunction
        - Name: Resource
          Value: !Sub '${OrderApiFunction}:live'
        - Name: ExecutedVersion
          Value: !GetAtt OrderApiFunction.Version.Version
      ExtendedStatistic: p99
      Period: 60
      EvaluationPeriods: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  FulfilmentDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cicd-workshop-fulfilment-dlq
      MessageRetentionPeriod: 1209600

  ShippingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cicd-workshop-shipping
      VisibilityTimeout: 60

  OrderApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: >-
              API Gateway invokes this function synchronously and returns any
              error to the caller. A dead-letter queue only receives failed
              asynchronous invocations, so it would never get a message.
    Properties:
      FunctionName: cicd-workshop-order-api
      CodeUri: ./src/order-api/
      Handler: index.handler
      AutoPublishAlias: live
      DeploymentPreference:
        Type: Canary10Percent5Minutes
        Alarms:
          - !Ref OrderApiErrorAlarm
          - !Ref OrderApiDurationAlarm
      Environment:
        Variables:
          PAYMENT_SECRET_ID: cicd-workshop/payment-api
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref OrdersTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cicd-workshop/payment-api-*'
      Events:
        PostOrder:
          Type: Api
          Properties:
            Path: /orders
            Method: post

  FulfilmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cicd-workshop-fulfilment
      CodeUri: ./src/fulfilment/
      Handler: index.handler
      Environment:
        Variables:
          SHIPPING_QUEUE_URL: !Ref ShippingQueue
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt FulfilmentDLQ.Arn
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ShippingQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt FulfilmentDLQ.QueueName
      Events:
        OrderPlaced:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern:
              source:
                - cicd-workshop.orders
              detail-type:
                - OrderPlaced

Outputs:
  ApiUrl:
    Description: Order API endpoint
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  ShippingQueueUrl:
    Description: Shipping queue URL
    Value: !Ref ShippingQueue
  EventBusName:
    Description: Event bus name
    Value: !Ref EventBus
