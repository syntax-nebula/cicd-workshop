AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CI/CD workshop - event-driven order processing

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment. Drives naming and sizing.
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARN, ERROR]

Mappings:
  EnvConfig:
    dev:
      MemorySize: 256
      LogRetentionDays: 7
    staging:
      MemorySize: 512
      LogRetentionDays: 14
    prod:
      MemorySize: 1024
      LogRetentionDays: 30

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]      # the lab host is ARM, so sam local runs the ARM image natively
    Timeout: 30
    MemorySize: !FindInMap [EnvConfig, !Ref Environment, MemorySize]
    Environment:
      Variables:
        ORDERS_TABLE: !Ref OrdersTable
        EVENT_BUS_NAME: !Ref EventBus
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel

Resources:
  ProdCanaryConfig:             # prod only: 10% of the traffic for one minute, then all of it
    Type: AWS::CodeDeploy::DeploymentConfig
    Condition: IsProd
    Properties:
      ComputePlatform: Lambda
      TrafficRoutingConfig:
        Type: TimeBasedCanary
        TimeBasedCanary:
          CanaryPercentage: 10
          CanaryInterval: 1

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cicd-workshop-${Environment}-orders
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH

  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub cicd-workshop-${Environment}-bus

  PreTrafficHookFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: >-
              CodeDeploy waits for this hook to report a status. If it fails,
              the deployment fails and rolls back, so there is no event to lose.
    Properties:
      FunctionName: !Sub CodeDeployHook_cicd-workshop-${Environment}-pre-traffic
      CodeUri: ./src/hooks/
      Handler: pre-traffic.handler
      Timeout: 60
      DeploymentPreference:
        Enabled: false
      Environment:
        Variables:
          NEW_VERSION_ARN: !Ref OrderApiFunction.Version
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - codedeploy:PutLifecycleEventHookExecutionStatus
              Resource: !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:*'
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub '${OrderApiFunction.Arn}:*'

  OrderApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cicd-workshop-${Environment}-order-api-errors
      AlarmDescription: Errors on the order API live alias during deployment
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref OrderApiFunction
        - Name: Resource
          Value: !Sub '${OrderApiFunction}:live'
        - Name: ExecutedVersion
          Value: !GetAtt OrderApiFunction.Version.Version
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  OrderApiDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cicd-workshop-${Environment}-order-api-duration
      AlarmDescription: p99 latency on the order API live alias
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref OrderApiFunction
        - Name: Resource
          Value: !Sub '${OrderApiFunction}:live'
        - Name: ExecutedVersion
          Value: !GetAtt OrderApiFunction.Version.Version
      ExtendedStatistic: p99
      Period: 60
      EvaluationPeriods: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  FulfilmentDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub cicd-workshop-${Environment}-fulfilment-dlq
      MessageRetentionPeriod: 1209600

  ShippingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub cicd-workshop-${Environment}-shipping
      VisibilityTimeout: 60

  OrderApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: >-
              API Gateway invokes this function synchronously and returns any
              error to the caller. A dead-letter queue only receives failed
              asynchronous invocations, so it would never get a message.
    Properties:
      FunctionName: !Sub cicd-workshop-${Environment}-order-api
      CodeUri: ./src/order-api/
      Handler: index.handler
      AutoPublishAlias: live
      DeploymentPreference:
        Type: !If [IsProd, !Ref ProdCanaryConfig, AllAtOnce]
        Alarms:
          - !Ref OrderApiErrorAlarm
          - !Ref OrderApiDurationAlarm
        Hooks:
          PreTraffic: !Ref PreTrafficHookFunction
      Environment:
        Variables:
          PAYMENT_SECRET_ID: cicd-workshop/payment-api
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref OrdersTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cicd-workshop/payment-api-*'
      Events:
        PostOrder:
          Type: Api
          Properties:
            Path: /orders
            Method: post

  FulfilmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cicd-workshop-${Environment}-fulfilment
      CodeUri: ./src/fulfilment/
      Handler: index.handler
      Environment:
        Variables:
          SHIPPING_QUEUE_URL: !Ref ShippingQueue
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt FulfilmentDLQ.Arn
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ShippingQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt FulfilmentDLQ.QueueName
      Events:
        OrderPlaced:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern:
              source:
                - cicd-workshop.orders
              detail-type:
                - OrderPlaced

  OrderApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/cicd-workshop-${Environment}-order-api'
      RetentionInDays: !FindInMap [EnvConfig, !Ref Environment, LogRetentionDays]

  FulfilmentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/cicd-workshop-${Environment}-fulfilment'
      RetentionInDays: !FindInMap [EnvConfig, !Ref Environment, LogRetentionDays]

Outputs:
  Environment:
    Description: Deployed environment
    Value: !Ref Environment
  ApiUrl:
    Description: Order API endpoint
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  ShippingQueueUrl:
    Description: Shipping queue URL
    Value: !Ref ShippingQueue
  EventBusName:
    Description: Event bus name
    Value: !Ref EventBus
