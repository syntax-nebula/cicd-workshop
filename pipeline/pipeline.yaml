AWSTemplateFormatVersion: '2010-09-09'
Description: CI/CD workshop - multi-stage pipeline

Parameters:
  ProjectName:
    Type: String
    Default: cicd-workshop

Resources:

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-artifacts-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 7

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketLocation, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: [ssm:GetParameters, ssm:GetParameter]
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/*'

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-build'
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      TimeoutInMinutes: 20
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: ARTIFACT_BUCKET
            Value: !Ref ArtifactBucket
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Cache:
        Type: S3
        Location: !Sub '${ArtifactBucket}/build-cache'

  CfnDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Workshop only. In production, scope this to the resource types
        # the application actually creates.
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: IamForServerless
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [iam:CreateRole, iam:DeleteRole, iam:GetRole, iam:PassRole,
                         iam:AttachRolePolicy, iam:DetachRolePolicy, iam:PutRolePolicy,
                         iam:DeleteRolePolicy, iam:GetRolePolicy, iam:TagRole, iam:UntagRole]
                Resource: '*'

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketVersioning, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !GetAtt BuildProject.Arn
              - Effect: Allow
                Action: [cloudformation:CreateStack, cloudformation:UpdateStack,
                         cloudformation:DescribeStacks, cloudformation:DescribeStackEvents,
                         cloudformation:CreateChangeSet, cloudformation:ExecuteChangeSet,
                         cloudformation:DeleteChangeSet, cloudformation:DescribeChangeSet,
                         cloudformation:SetStackPolicy]
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-*/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnDeployRole.Arn

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}-pipeline'
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:

        - Name: Source
          Actions:
            - Name: SourceZip
              ActionTypeId: { Category: Source, Owner: AWS, Provider: S3, Version: '1' }
              OutputArtifacts: [{ Name: SourceOutput }]
              Configuration:
                S3Bucket: !Ref ArtifactBucket
                S3ObjectKey: source/source.zip
                PollForSourceChanges: true
              RunOrder: 1

        - Name: Build
          Actions:
            - Name: BuildAndTest
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              InputArtifacts: [{ Name: SourceOutput }]
              OutputArtifacts: [{ Name: BuildOutput }]
              Configuration:
                ProjectName: !Ref BuildProject
              RunOrder: 1

        - Name: DeployDev
          Actions:
            - Name: DeployDev
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CloudFormation, Version: '1' }
              InputArtifacts: [{ Name: BuildOutput }]
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub '${ProjectName}-dev'
                TemplatePath: BuildOutput::packaged.yaml
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !GetAtt CfnDeployRole.Arn
                ParameterOverrides: '{"Environment":"dev","LogLevel":"DEBUG"}'
              RunOrder: 1

        - Name: DeployStaging
          Actions:
            - Name: DeployStaging
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CloudFormation, Version: '1' }
              InputArtifacts: [{ Name: BuildOutput }]
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub '${ProjectName}-staging'
                TemplatePath: BuildOutput::packaged.yaml
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !GetAtt CfnDeployRole.Arn
                ParameterOverrides: '{"Environment":"staging","LogLevel":"INFO"}'
              RunOrder: 1

        - Name: DeployProd
          Actions:
            - Name: DeployProd
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CloudFormation, Version: '1' }
              InputArtifacts: [{ Name: BuildOutput }]
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub '${ProjectName}-prod'
                TemplatePath: BuildOutput::packaged.yaml
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !GetAtt CfnDeployRole.Arn
                ParameterOverrides: '{"Environment":"prod","LogLevel":"WARN"}'
              RunOrder: 1

Outputs:
  ArtifactBucket:
    Value: !Ref ArtifactBucket
  PipelineName:
    Value: !Ref Pipeline
